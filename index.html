<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080F17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LabTrack — Smart Lab Equipment Tracking</title>
  <meta name="description" content="LabTrack is a smart equipment tracking system for college labs. Manage checkouts, returns, maintenance, and user approvals on any device." />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>

  <div id="app">
    <!-- Top Navigation Bar -->
    <header class="topbar">
      <div class="brand">
        <button id="hamburgerToggle" class="hamburger-btn" title="Toggle Menu"
          aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="sidebar">☰</button>
        <div class="brand-logo-wrap">
          <div class="brand-icon-box">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 3H15M10 3V6L5.5 16.5C4.9 17.8 5.8 19.5 7.2 19.5H16.8C18.2 19.5 19.1 17.8 18.5 16.5L14 6V3"
                stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7.5 14H16.5" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
              <circle cx="10" cy="9" r="1" fill="#2DD4BF"/>
              <circle cx="14" cy="11" r="1.2" fill="#ffffff"/>
            </svg>
            <div class="brand-icon-shine"></div>
          </div>
          <div class="brand-text">
            <span class="brand-name">LabTrack</span>
            <span class="brand-sub">Smart Tracking</span>
          </div>
        </div>
      </div>

      <div class="topbar-right">
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle theme">🌙</button>
        <div id="profileBox"></div>
      </div>
    </header>

    <!-- Main Workspace Shell -->
    <div class="shell">
      <!-- Backdrop overlay — tapping closes sidebar on mobile -->
      <div id="sidebarBackdrop" aria-hidden="true"></div>
      <!-- Sidebar Navigation -->
      <nav id="sidebar" role="navigation" aria-label="Main navigation"></nav>
      <!-- Main Content -->
      <main id="main" role="main">
        <div class="loading-note">Initializing LabTrack</div>
      </main>
    </div>
  </div>

  <!-- Authentication Overlay -->
  <div id="authOverlay" class="auth-overlay" style="display:none;"
    role="dialog" aria-modal="true" aria-label="Sign in to LabTrack">
    <div class="auth-orb auth-orb-1" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-2" aria-hidden="true"></div>
    <div class="auth-orb auth-orb-3" aria-hidden="true"></div>
    <div id="authCard" class="auth-card"></div>
  </div>

  <!-- Toast Notifications -->
  <div id="toastHost" aria-live="polite"></div>

  <!-- App Script -->
  <script src="js/app.js"></script>
</body>
</html>

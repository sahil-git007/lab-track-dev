<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabTrack — Smart Equipment Tracking</title>
  <meta name="description" content="Smart Equipment Tracking & Management system for college and university laboratories." />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <!-- QR Code Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- QR Scanner / Decoder Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>

  <div id="app">
    <!-- Top Navigation Bar -->
    <header class="topbar">
      <div class="brand">
        <button id="hamburgerToggle" class="icon-btn hamburger-btn" title="Toggle navigation menu" aria-label="Toggle navigation menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <div class="brand-logo-wrap">
          <div class="brand-icon-box">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 3H15M10 3V6L5.5 16.5C4.9 17.8 5.8 19.5 7.2 19.5H16.8C18.2 19.5 19.1 17.8 18.5 16.5L14 6V3" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7.5 14H16.5" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
              <circle cx="10" cy="9" r="1" fill="#2DD4BF"/>
              <circle cx="14" cy="11" r="1.2" fill="#ffffff"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">LabTrack</span>
            <span class="brand-tag">Smart Tracking</span>
          </div>
        </div>
      </div>

      <div class="topbar-right">
        <button id="themeToggleBtn" class="icon-btn theme-toggle-btn" title="Toggle dark / light mode" aria-label="Toggle dark or light mode">
          <svg class="theme-icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="theme-icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <div id="profileBox"></div>
      </div>
    </header>

    <!-- Main Workspace Shell -->
    <div class="shell">
      <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
      <!-- Collapsible Sidebar Navigation -->
      <nav id="sidebar" class="sidebar"></nav>

      <!-- Dynamic Content View Area -->
      <main id="main" class="main">
        <div class="loading-note">Initializing application…</div>
      </main>
    </div>
  </div>

  <!-- Authentication Overlay Modal -->
  <div id="authOverlay" class="auth-overlay" style="display:none;">
    <div id="authCard" class="auth-card"></div>
  </div>

  <!-- Toast Notification Host -->
  <div id="toastHost"></div>

  <!-- Application Script -->
  <script src="js/app.js"></script>
</body>
</html>

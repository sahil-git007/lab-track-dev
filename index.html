<div class="brand">
  <button id="hamburgerToggle" class="hamburger-btn" title="Toggle Navigation Menu">☰</button>
  <div class="brand-logo-wrap" style="display: flex; align-items: center; gap: 12px;">
    
    <!-- Meaningful Modern Logo Icon -->
    <div class="brand-icon-box" style="
      background: linear-gradient(135deg, #24806B 0%, #16324F 100%);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(36, 128, 107, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    ">
      <!-- SVG Icon: Scanning / Tracking Target + Beaker representation -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2V4M12 20V22M2 12H4M20 12H22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M9 7H15M10 11H14M8 15H16" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round"/>
        <rect x="7" y="3" width="10" height="18" rx="2" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 2" opacity="0.4"/>
      </svg>
      <div style="
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 70%);
        pointer-events: none;
      "></div>
    </div>

    <!-- Brand Typography -->
    <div class="brand-text" style="display: flex; flex-direction: column;">
      <span style="font-weight: 800; font-size: 1.2rem; letter-spacing: -0.02em; color: var(--ink); line-height: 1.1;">LabTrack</span>
      <span style="font-size: 0.7rem; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase;">Smart Tracking</span>
    </div>

  </div>
</div>
